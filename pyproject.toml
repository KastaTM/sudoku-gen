[project]
name = "sudoku-gen"
version = "0.2.0"
description = "A deterministic Sudoku generation engine."
readme = "README.md"
authors = [
    { name = "Rodrigo Castañón Martínez", email = "rodrikasta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["sudoku_gen"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
